<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Techies Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 480px; height: 300px; overflow: hidden; background: transparent;
    font-family: 'Poppins', sans-serif; -webkit-font-smoothing: antialiased; }
  .logo { width: 480px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .mark {
    position: relative; width: 138px; height: 138px; border-radius: 38px;
    background: linear-gradient(145deg, #3FA9F5 0%, #0070C0 55%, #0B4F9C 100%);
    box-shadow: 0 10px 24px rgba(0,112,192,.30), inset 0 2px 0 rgba(255,255,255,.25);
    display: grid; place-items: center;
  }
  .mark svg.code { width: 84px; height: 84px; }
  .spark { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px; }
  .word { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: #1F4E79; }
  .word span { color: #0070C0; }
  .tag { font-size: 15px; font-weight: 600; letter-spacing: 6px; color: #64748B; margin-top: -4px; padding-left: 6px; }
</style>
</head>
<body>
<div class="logo">
  <div class="mark">
    <!-- code brackets -->
    <svg class="code" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="8 6 3 12 8 18"/><polyline points="16 6 21 12 16 18"/><line x1="13.5" y1="4.5" x2="10.5" y2="19.5"/>
    </svg>
    <!-- 4-point spark -->
    <svg class="spark" viewBox="0 0 24 24"><path d="M12 1 C12.9 8.2 15.8 11.1 23 12 C15.8 12.9 12.9 15.8 12 23 C11.1 15.8 8.2 12.9 1 12 C8.2 11.1 11.1 8.2 12 1Z" fill="#A5F3FC"/></svg>
  </div>
  <div class="word">Tech<span>ies</span></div>
  <div class="tag">TEAM</div>
</div>
</body>
</html>
